<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrameFind — Find the visual idea you're looking for</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header: Wide horizontal navigation-style header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-group">
        <div class="brand-logo" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </div>
        <h1 class="brand-title">FrameFind</h1>
      </div>
      <p class="tagline">Find the visual idea you're looking for.</p>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">
    <!-- Search UI Section -->
    <section class="search-section" aria-labelledby="search-heading">
      <h2 id="search-heading" class="visually-hidden">Search Form</h2>
      
      <form id="search-form" class="search-form" role="search">
        <div class="search-input-wrapper">
          <svg class="search-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <label for="search-input" class="visually-hidden">Search for visual ideas</label>
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="Search photos, illustrations, concepts..."
            autocomplete="off"
            spellcheck="false"
          >
        </div>
        <button type="button" id="search-button" class="search-button">Search</button>
      </form>

      <!-- Original Feature 2: Category / Quick-pick Suggestion Chips -->
      <div class="quick-picks" aria-label="Suggested search categories">
        <span class="quick-picks-label">Suggested:</span>
        <div class="chips-group">
          <button type="button" class="chip">Nature</button>
          <button type="button" class="chip">Cities</button>
          <button type="button" class="chip">Animals</button>
          <button type="button" class="chip">Space</button>
        </div>
      </div>
    </section>

    <!-- Original Feature 3: Result-count Placeholder -->
    <section class="results-meta-section" aria-label="Search status">
      <p id="result-count" class="result-count">Results will appear here</p>
    </section>

    <!-- Original Feature 1: Empty-State Message -->
    <div class="empty-state-container">
      <div class="empty-state-graphic" aria-hidden="true">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
      </div>
      <p id="empty-state" class="empty-state">Search for something to discover visual inspiration.</p>
    </div>

    <!-- Results Container: Must be genuinely empty for Part 1 -->
    <section id="results" class="results-grid" aria-label="Image search results"></section>
  </main>

  <!-- Accessible Footer -->
  <footer class="app-footer">
    <p>&copy; FrameFind &bull; Visual Search Interface</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
